<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="800" height="320" fill="#ffffff"/>

  <!-- THE badge -->
  <rect x="160" y="70" width="48" height="28" rx="4" fill="#E6007E"/>
  <text x="184" y="89" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">THE</text>
  <text x="218" y="90" font-size="16" font-weight="700" fill="#1a1a1a">World University Rankings 2026</text>

  <!-- University name -->
  <text x="160" y="142" font-size="32" font-weight="700" fill="#1a1a1a">Leiden University</text>

  <!-- Divider -->
  <line x1="160" y1="166" x2="640" y2="166" stroke="#e2e2e4" stroke-width="1"/>

  <!-- Stat: World Ranking -->
  <text x="160" y="192" font-size="15" font-weight="600" fill="#555555">World Ranking</text>
  <text x="160" y="250" font-size="58" font-weight="800" fill="#E6007E">=70<tspan font-size="24" dy="-30">th</tspan></text>

  <!-- Vertical divider -->
  <line x1="390" y1="178" x2="390" y2="242" stroke="#e2e2e4" stroke-width="1"/>

  <!-- Stat: Arts and Humanities -->
  <text x="420" y="192" font-size="15" font-weight="600" fill="#555555">Arts &amp; Humanities</text>
  <text x="420" y="250" font-size="58" font-weight="800" fill="#3949ab">18<tspan font-size="24" dy="-30">th</tspan></text>
</svg>
